name: Build and deploy Angular app to Azure (Develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - run: npm run build -- --configuration production

      - run: ls -la dist/cotrafa-transaccional/browser

      - uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/cotrafa-transaccional/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: .

      - uses: azure/webapps-deploy@v2
        with:
          app-name: transactions-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
