name: Build and deploy Angular app to Azure (Develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      - name: Verify dist output
        run: ls -la dist/cotrafa-transaccional/browser

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/cotrafa-transaccional/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: Develop

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure startup command (Angular SPA)
        run: |
          az webapp config set \
            --name transactions-app \
            --resource-group transactions-front \
            --startup-file "pm2 serve /home/site/wwwroot --no-daemon --spa"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: transactions-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
