<div class="flex h-screen surface-ground">
    <div class="hidden md:flex w-18rem bg-white border-right-1 surface-border flex-column shadow-1 z-2">
        <ng-container *ngTemplateOutlet="menuContent"></ng-container>
    </div>

    <p-drawer [(visible)]="sidebarVisible" [modal]="true" styleClass="w-18rem">
        <ng-template pTemplate="content">
            <div class="flex flex-column h-full">
                 <ng-container *ngTemplateOutlet="menuContent"></ng-container>
            </div>
        </ng-template>
    </p-drawer>

    <div class="flex-1 flex flex-column overflow-hidden relative">
        <header class="h-4rem bg-white border-bottom-1 surface-border flex align-items-center px-4 justify-content-between shadow-sm z-1">
            <div class="flex align-items-center gap-3">
                <p-button icon="pi pi-bars" [text]="true" [rounded]="true" styleClass="md:hidden text-700" (onClick)="toggleSidebar()"></p-button>
                <h2 class="text-lg font-semibold text-800 m-0">Dashboard</h2>
            </div>
            
             <div class="flex align-items-center gap-2">
            </div>
        </header>
        
        <main class="flex-1 overflow-y-auto p-4">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>

<ng-template #menuContent>
    <div class="p-4 border-bottom-1 surface-border flex align-items-center gap-2">
        <div class="w-2rem h-2rem bg-primary border-circle flex align-items-center justify-content-center text-white font-bold">C</div>
        <span class="font-bold text-xl text-900">Cotrafa</span>
    </div>

    <nav class="flex-1 p-3 overflow-y-auto">
        <ul class="list-none p-0 m-0 flex flex-column gap-2">
            <li *ngFor="let item of menuItems">
                <a [routerLink]="item.route" 
                   routerLinkActive="bg-primary-50 text-primary border-primary-500"
                   (click)="sidebarVisible.set(false)"
                   class="flex align-items-center gap-3 p-3 border-round text-700 hover:surface-100 transition-colors cursor-pointer no-underline border-left-3 border-transparent">
                    <i [class]="item.icon" class="text-lg"></i>
                    <span class="font-medium">{{ item.label }}</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="p-3 border-top-1 surface-border mt-auto">
            <div class="flex align-items-center gap-3 p-2 border-round hover:surface-100 cursor-pointer transition-colors">
            <p-avatar icon="pi pi-user" shape="circle" styleClass="bg-primary-50 text-primary"></p-avatar>
            <div class="flex flex-column">
                <span class="text-sm font-bold text-900">Usuario</span>
                <span class="text-xs text-500">Cerrar Sesión</span>
            </div>
        </div>
    </div>
</ng-template>
