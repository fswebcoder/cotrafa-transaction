<div
  class="surface-card p-4 shadow-1 border-round-xl border-left-3 border-primary flex justify-content-between align-items-center flex-wrap gap-3"
>
  <div>
    <h1 class="text-2xl font-bold text-900 m-0 mb-2">Resumen de Productos</h1>
    <p class="text-600 m-0">Gestiona tus cuentas y consulta tus saldos disponibles.</p>
  </div>
  <div class="flex gap-2">
    <p-button
      label="Recargar"
      icon="pi pi-plus"
      styleClass="p-button-rounded p-button-outlined"
      [disabled]="depositDisabled()"
      (onClick)="depositClick.emit()"
    ></p-button>
    <p-button
      label="Nueva Transacción"
      icon="pi pi-plus"
      styleClass="p-button-rounded"
      [routerLink]="['/dashboard/transactions']"
    ></p-button>
  </div>
</div>
