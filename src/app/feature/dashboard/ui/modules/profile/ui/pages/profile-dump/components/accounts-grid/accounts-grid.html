<div class="grid">
  <ng-container *ngIf="accounts(); else loadingAccounts">
    <div *ngFor="let account of accounts()" class="col-12 md:col-6">
      <div
        class="surface-card p-4 shadow-1 border-round-xl h-full flex flex-column justify-content-between transition-colors hover:surface-50 cursor-pointer border-1 surface-border"
      >
        <div class="flex justify-content-between align-items-start mb-4">
          <div class="flex align-items-center gap-3">
            <div class="w-3rem h-3rem bg-primary-50 border-circle flex align-items-center justify-content-center">
              <i class="pi pi-wallet text-xl text-primary"></i>
            </div>
            <div>
              <span class="text-600 text-sm block mb-1">Cuenta de Ahorros</span>
              <span class="text-900 font-bold text-lg">{{ account.account_alias || 'Cuenta Principal' }}</span>
            </div>
          </div>
          <i class="pi pi-ellipsis-v text-500 hover:text-900"></i>
        </div>

        <div>
          <span class="text-500 text-sm block mb-1">Saldo Disponible</span>
          <div class="text-3xl font-bold text-900 mb-3">{{ account.account_balance | currency }}</div>

          <div class="surface-100 border-round p-2 flex align-items-center justify-content-between">
            <span class="text-600 font-mono text-sm">{{ account.account_number }}</span>
            <i
              class="pi pi-copy text-primary cursor-pointer hover:text-primary-700"
              pTooltip="Copiar número"
              tooltipPosition="top"
            ></i>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #loadingAccounts>
    <div class="col-12 md:col-6" *ngFor="let i of [1, 2]">
      <div class="surface-card p-4 shadow-1 border-round-xl h-full border-1 surface-border">
        <div class="flex justify-content-between align-items-start mb-4">
          <div class="flex align-items-center gap-3">
            <p-skeleton shape="circle" size="3rem"></p-skeleton>
            <div>
              <p-skeleton width="6rem" styleClass="mb-1"></p-skeleton>
              <p-skeleton width="8rem"></p-skeleton>
            </div>
          </div>
        </div>
        <div>
          <p-skeleton width="7rem" styleClass="mb-1"></p-skeleton>
          <p-skeleton width="10rem" height="2rem" styleClass="mb-3"></p-skeleton>
          <p-skeleton width="100%" height="2.5rem"></p-skeleton>
        </div>
      </div>
    </div>
  </ng-template>
</div>
