<p-dialog
  header="Recargar cuenta"
  [visible]="visible()"
  (visibleChange)="handleVisibleChange($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '30rem'  }">
  <form [formGroup]="form" (ngSubmit)="submitForm()" class="flex flex-column gap-4 mt-3">
    <cf-custom-select
      label="Cuenta"
      [options]="accountOptions()"
      optionLabel="label"
      optionValue="value"
      [showClear]="false"
      formControlName="accountNumber">
    </cf-custom-select>

    <cf-custom-input
      formControlName="amount"
      label="Monto a recargar"
      mask="separator.0"
      thousandSeparator=","
      decimalMarker="."
      prefix="$ "
      type="text">
    </cf-custom-input>

    @if (error()) {
      <small class="text-red-600">{{ error() }}</small>
    }

    <div class="flex justify-content-end gap-2">
      <cf-custom-button
        label="Cancelar"
        variant="white"
        type="button"
        [disabled]="loading()"
        (onClick)="cancel()">
      </cf-custom-button>
      <cf-custom-button
        label="Recargar"
        icon="pi pi-check"
        type="submit"
        [loading]="loading()"
        [disabled]="form.invalid">
      </cf-custom-button>
    </div>
  </form>
</p-dialog>
