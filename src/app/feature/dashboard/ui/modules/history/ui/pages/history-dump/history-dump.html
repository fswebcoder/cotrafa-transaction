<div class="grid p-4">
  <div class="col-12">
    <div class="grid">
      <div class="col-12 lg:col-4 xl:col-3 mb-3 lg:mb-0">
        <cf-account-summary-card [user]="user()"></cf-account-summary-card>
      </div>

      <div class="col-12 lg:col-8 xl:col-9">
        <cf-history-transactions-card
          [history]="history()"
          [loading]="loading()"
          [totalElements]="totalElements()"
          (onPageChange)="onPageChange.emit($event)">
        </cf-history-transactions-card>
      </div>
    </div>
  </div>
</div>
