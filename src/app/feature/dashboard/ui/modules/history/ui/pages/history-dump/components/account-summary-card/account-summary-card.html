<p-card styleClass="h-full shadow-2 border-round-2xl surface-card">
  <div class="flex flex-column h-full justify-content-between">
    <div>
      <div class="flex align-items-center gap-3 mb-4">
        <div class="w-3rem h-3rem bg-primary-100 border-circle flex align-items-center justify-content-center">
           <i class="pi pi-wallet text-primary text-xl"></i>
        </div>
        <div>
          <span class="block text-xl font-bold text-900">Mi Cuenta</span>
          <span class="text-sm text-600">Origen de fondos</span>
        </div>
      </div>
      
      <ng-container *ngIf="user()?.user_accounts?.[0] as account; else loadingAccount">
        <div class="surface-50 p-4 border-round-xl border-1 surface-border">
          <span class="block text-600 text-sm mb-1">Saldo Disponible</span>
          <span class="block text-4xl font-bold text-900 mb-3">{{ account.account_balance | currency:'USD':'symbol':'1.0-0' }}</span>
          <div class="flex align-items-center gap-2">
            <span class="bg-primary-50 text-primary text-xs font-bold px-2 py-1 border-round">AHORROS</span>
            <span class="text-600 text-sm">•••• {{ account.account_number | slice:-4 }}</span>
          </div> 
        </div>
      </ng-container>
      <ng-template #loadingAccount>
        <div class="surface-50 p-4 border-round-xl border-1 surface-border">
          <p-skeleton width="40%" height="1rem" styleClass="mb-2"></p-skeleton>
          <p-skeleton width="70%" height="3rem" styleClass="mb-3"></p-skeleton>
          <p-skeleton width="50%" height="1.5rem"></p-skeleton>
        </div>
      </ng-template>
    </div>

    <div class="mt-4 pt-4 border-top-1 surface-border">
      <div class="flex align-items-center gap-2 text-600 text-sm">
        <i class="pi pi-info-circle"></i>
        <span>Consulta tus últimos movimientos aquí.</span>
      </div>
    </div>
  </div>
</p-card>
